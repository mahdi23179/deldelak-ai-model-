name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend test suite (mock LLM - no model download needed)
        run: pytest -q --tb=short
      - name: Run gateway logic tests (node)
        working-directory: gateway
        run: node --test test/controller.test.mjs
      - name: Workflow guard logic tests
        run: pytest tests/test_06_workflow_logic.py -q
      - name: Syntax check frontend
        run: node --check frontend/js/app.js && node --check frontend/js/key-admin.js
      - name: Syntax check gateway worker
        working-directory: gateway
        run: node --check src/worker.js && node --check src/controller.js
