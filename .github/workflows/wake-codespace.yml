name: Wake Deldelak Codespace

# روشن‌کردن خودکار کداسپیس + فعال شدن چت‌بات
# سه راه برای بیدار کردن:
#   1) دکمه Run workflow در تب Actions (کاربر صاحب مخزن)
#   2) ارسال repository_dispatch از بیرون با توکن
#   3) ساخت یک Issue با عنوان یا بدنه حاوی "!wake" (هر کسی، بدون نیاز به توکن)
# + زمان‌بندی اختیاری Keep-Alive: متغیر مخزن KEEPALIVE_ENABLED=true

on:
  workflow_dispatch:
    inputs:
      idle_minutes:
        description: "Idle timeout in minutes (max 240)"
        required: false
        default: "240"
  repository_dispatch:
    types: [wake-bot]
  issues:
    types: [opened]
  schedule:
    - cron: "*/25 * * * *" # guarded: only runs when repo variable KEEPALIVE_ENABLED=true

permissions:
  contents: read
  issues: write
  # NOTE: `codespaces` is not a valid GITHUB_TOKEN permission key; the Codespace
  # operations run with secrets.WAKE_TOKEN (a PAT with Codespaces: write).

concurrency:
  group: wake-codespace
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.WAKE_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      PORT: "8000"
    steps:
      - name: Guard (schedule keep-alive enabled?)
        if: github.event_name == 'schedule'
        run: |
          ENABLED=$(gh api "repos/${REPO}/actions/variables/KEEPALIVE_ENABLED" --jq '.value' 2>/dev/null || echo "false")
          if [ "$ENABLED" != "true" ]; then
            echo "Keep-alive غیرفعال است (متغیر مخزن KEEPALIVE_ENABLED=true کنید)."
            echo "RUN=false" >> "$GITHUB_ENV"
          else
            echo "RUN=true" >> "$GITHUB_ENV"
          fi

      - name: Guard (issue wake keyword)
        if: github.event_name == 'issues'
        run: |
          TEXT="${{ github.event.issue.title }} ${{ github.event.issue.body }}"
          if echo "$TEXT" | grep -qi '!wake'; then
            echo "RUN=true" >> "$GITHUB_ENV"
          else
            echo "روی این issue کلیدواژه !wake نبود؛ بیدارسازی انجام نشد."
            echo "RUN=false" >> "$GITHUB_ENV"
          fi

      - name: Guard (other events)
        if: github.event_name != 'schedule' && github.event_name != 'issues'
        run: echo "RUN=true" >> "$GITHUB_ENV"

      - name: Create or pick Codespace
        if: env.RUN == 'true'
        id: cs
        run: |
          NAME=$(gh api "user/codespaces?per_page=100" --paginate \
            --jq ".codespaces[] | select(.repository.full_name==\"${REPO}\") | .name" 2>/dev/null | head -1 || true)
          if [ -z "$NAME" ]; then
            echo "کداسپیس وجود ندارد؛ ساخت..."
            NAME=$(gh api -X POST "repos/${REPO}/codespaces" \
              -f ref=main -f machine_type=basicLinux32gb --jq '.name')
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "کداسپیس: ${NAME}"

      - name: Start Codespace
        if: env.RUN == 'true'
        run: |
          NAME="${{ steps.cs.outputs.name }}"
          STATE=$(gh api "user/codespaces/${NAME}" --jq '.state')
          echo "state=${STATE}"
          if [ "$STATE" = "Shutdown" ] || [ "$STATE" = "Stopped" ] || [ "$STATE" = "Archived" ]; then
            echo "روشن کردن کداسپیس..."
            gh api -X POST "user/codespaces/${NAME}/start" >/dev/null
          fi

      - name: Make port public (so users can open the chatbot without login)
        if: env.RUN == 'true'
        run: |
          NAME="${{ steps.cs.outputs.name }}"
          gh api -X PUT "user/codespaces/${NAME}/ports/${PORT}" \
            -H "Content-Type: application/json" \
            -d '{"visibility":"open"}' >/dev/null 2>&1 || \
            echo "::warning::نتوانستم پورت را عمومی کنم (ممکن است قبلاً عمومی باشد)"

      - name: Extend idle timeout (best effort, max 240 min)
        if: env.RUN == 'true'
        run: |
          NAME="${{ steps.cs.outputs.name }}"
          MINS="${{ github.event.inputs.idle_minutes || '240' }}"
          gh api -X PATCH "user/codespaces/${NAME}" -f idle_timeout_minutes="${MINS}" >/dev/null 2>&1 \
            && echo "idle timeout → ${MINS} min" || echo "::warning::تغییر idle timeout ناموفق (به مجوز توکن بستگی دارد)"

      - name: Wait for the chatbot to come alive
        if: env.RUN == 'true'
        id: wait
        run: |
          NAME="${{ steps.cs.outputs.name }}"
          BASE="https://${NAME}-${PORT}.app.github.dev"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "آدرس: ${BASE}"
          DEADLINE=$(( $(date +%s) + 1500 )) # 25 min
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            CODE=$(curl -s -o /tmp/h.json -w "%{http_code}" --max-time 10 "${BASE}/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "چت‌بات فعال شد!"
              cat /tmp/h.json
              echo "READY=true" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::چت‌بات در مهلت ۲۵ دقیقه پاسخ نداد (احتمالاً هنوز در حال نصب اولیه است)."
          echo "READY=false" >> "$GITHUB_ENV"

      - name: Job summary
        if: env.RUN == 'true'
        run: |
          BASE="${{ steps.wait.outputs.base }}"
          {
            echo "## دلدلک روشن شد | Deldelak is awake"
            echo ""
            if [ "${READY}" = "true" ]; then
              echo "| مورد | مقدار |"
              echo "|---|---|"
              echo "| کداسپیس | \`${{ steps.cs.outputs.name }}\` |"
              echo "| وب‌چت (چت‌بات) | [${BASE}](${BASE}) |"
              echo "| سلامت API | [${BASE}/health](${BASE}/health) |"
              echo "| کلید API | بار اول: ${BASE}/api/key |"
            else
              echo "کداسپیس روشن است ولی نصب اولیه هنوز ادامه دارد. چند دقیقه بعد دوباره Run کنید."
            fi
            echo ""
            echo "> کداسپیس پس از خلوتی متوقف می‌شود؛ برای روشن‌کردن مجدد همین workflow را دوباره اجرا کنید."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report on the wake issue
        if: env.RUN == 'true' && github.event_name == 'issues'
        run: |
          BASE="${{ steps.wait.outputs.base }}"
          if [ "${READY}" = "true" ]; then
            gh issue comment ${{ github.event.issue.number }} --repo "${REPO}" \
              --body "چت‌بات دلدلک روشن شد: [${BASE}](${BASE}) — بار اول کلید از [/api/key](${BASE}/api/key)"
          else
            gh issue comment ${{ github.event.issue.number }} --repo "${REPO}" \
              --body "کداسپیس روشن شد ولی هنوز آماده نیست (نصب اولیه). چند دقیقه بعد یک issue جدید با !wake بسازید."
          fi
